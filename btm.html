<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birtamode Monument Reconstruction</title>
<style>
body { margin: 0; overflow: hidden; background-color: #87CEEB; }
canvas { display: block; }
#info {
position: absolute;
top: 10px;
width: 100%;
text-align: center;
color: white;
font-family: sans-serif;
font-weight: bold;
text-shadow: 1px 1px 2px black;
pointer-events: none;
}
</style>
<!-- Import Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Import OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="info">Birtamode Monument - Drag to Rotate, Scroll to Zoom</div>
<script>
// --- SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // Sky blue
scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground
controls.minDistance = 5;
controls.maxDistance = 50;
controls.target.set(0, 6, 0);

// --- LIGHTING ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 50;
dirLight.shadow.camera.left = -15;
dirLight.shadow.camera.right = 15;
dirLight.shadow.camera.top = 15;
dirLight.shadow.camera.bottom = -15;
scene.add(dirLight);

// --- MATERIALS ---
const stoneMaterial = new THREE.MeshStandardMaterial({
color: 0xdedede,
roughness: 0.9,
flatShading: true
});

const pillarMaterial = new THREE.MeshStandardMaterial({
color: 0xcfb997, // Sandstone color
roughness: 0.8,
flatShading: true
});

const greenBaseMaterial = new THREE.MeshStandardMaterial({
color: 0x00a86b,
roughness: 0.6
});

const bronzeMaterial = new THREE.MeshStandardMaterial({
color: 0x4a3c31,
metalness: 0.6,
roughness: 0.4
});

const redFlagMaterial = new THREE.MeshStandardMaterial({
color: 0x8b0000,
side: THREE.DoubleSide
});

const fenceMaterial = new THREE.MeshStandardMaterial({
color: 0x222222,
metalness: 0.5
});

// --- BUILD MONUMENT FUNCTION ---
function createMonument() {
const monumentGroup = new THREE.Group();

// 1. The Green Base (Outer Ring)
const baseGeo = new THREE.CylinderGeometry(8, 8, 1.5, 32);
const base = new THREE.Mesh(baseGeo, greenBaseMaterial);
base.position.y = 0.75;
base.receiveShadow = true;
monumentGroup.add(base);

// 2. The Fence
const fenceRadius = 7.5;
const fenceHeight = 1.5;
const numPosts = 30;
const fenceGroup = new THREE.Group();

for(let i=0; i<numPosts; i++) {
const angle = (i / numPosts) * Math.PI * 2;
const x = Math.cos(angle) * fenceRadius;
const z = Math.sin(angle) * fenceRadius;

// Post
const postGeo = new THREE.CylinderGeometry(0.05, 0.05, fenceHeight, 8);
const post = new THREE.Mesh(postGeo, fenceMaterial);
post.position.set(x, 1.5 + fenceHeight/2, z);
fenceGroup.add(post);
}
// Top rail
const railGeo = new THREE.TorusGeometry(fenceRadius, 0.05, 8, 64);
const rail = new THREE.Mesh(railGeo, fenceMaterial);
rail.rotation.x = Math.PI / 2;
rail.position.y = 1.5 + fenceHeight;
fenceGroup.add(rail);

monumentGroup.add(fenceGroup);

// 3. Inner Steps/Plinth
const stepsGeo = new THREE.CylinderGeometry(4, 4.5, 2, 8); // Octagonal base
const steps = new THREE.Mesh(stepsGeo, stoneMaterial);
steps.position.y = 1.5 + 1;
steps.castShadow = true;
steps.receiveShadow = true;
monumentGroup.add(steps);

const plinthGeo = new THREE.BoxGeometry(3, 1.5, 3);
const plinth = new THREE.Mesh(plinthGeo, stoneMaterial);
plinth.position.y = 3.5 + 0.75;
plinth.castShadow = true;
monumentGroup.add(plinth);

// Red plaques on plinth
const plaqueGeo = new THREE.PlaneGeometry(2, 0.8);
const plaqueMat = new THREE.MeshStandardMaterial({ color: 0x800000 });
const plaque1 = new THREE.Mesh(plaqueGeo, plaqueMat);
plaque1.position.set(0, 3.5 + 0.75, 1.51);
monumentGroup.add(plaque1);

// 4. The Main Pillar
// It's faceted, so we use low radial segments (8)
const pillarHeight = 6;
// Bottom part of pillar (slightly wider)
const pillarBaseGeo = new THREE.CylinderGeometry(0.9, 1.1, 1, 8);
const pillarBase = new THREE.Mesh(pillarBaseGeo, pillarMaterial);
pillarBase.position.y = 5 + 0.5;
monumentGroup.add(pillarBase);

// Main shaft (tapering upwards)
const shaftGeo = new THREE.CylinderGeometry(0.7, 0.9, pillarHeight, 8);
const shaft = new THREE.Mesh(shaftGeo, pillarMaterial);
shaft.position.y = 6 + pillarHeight/2;
shaft.castShadow = true;
monumentGroup.add(shaft);

// Rings on pillar
const ringGeo = new THREE.TorusGeometry(0.8, 0.1, 8, 8);
const ring1 = new THREE.Mesh(ringGeo, pillarMaterial);
ring1.rotation.x = Math.PI/2;
ring1.position.y = 7.5;
monumentGroup.add(ring1);

// 5. The Capital (Top Bowl)
const capitalGroup = new THREE.Group();
capitalGroup.position.y = 6 + pillarHeight;

const neckGeo = new THREE.CylinderGeometry(0.9, 0.7, 0.8, 8);
const neck = new THREE.Mesh(neckGeo, pillarMaterial);
neck.position.y = 0.4;
capitalGroup.add(neck);

const bowlGeo = new THREE.CylinderGeometry(2, 0.9, 1, 8);
const bowl = new THREE.Mesh(bowlGeo, pillarMaterial);
bowl.position.y = 1.3;
capitalGroup.add(bowl);

const topPlatformGeo = new THREE.CylinderGeometry(2, 2, 0.2, 16);
const topPlatform = new THREE.Mesh(topPlatformGeo, pillarMaterial);
topPlatform.position.y = 1.9;
capitalGroup.add(topPlatform);

monumentGroup.add(capitalGroup);

// 6. The Statues (Abstracted)
const statueGroup = new THREE.Group();
statueGroup.position.y = 6 + pillarHeight + 2.0; // On top of platform

// Helper to create a generic human figure
function createFigure(x, z, rotation) {
const fig = new THREE.Group();
fig.position.set(x, 0, z);
fig.rotation.y = rotation;

// Legs
const legGeo = new THREE.CylinderGeometry(0.1, 0.12, 1.2, 8);
const legL = new THREE.Mesh(legGeo, bronzeMaterial);
legL.position.set(-0.2, 0.6, 0);
fig.add(legL);
const legR = new THREE.Mesh(legGeo, bronzeMaterial);
legR.position.set(0.2, 0.6, 0);
fig.add(legR);

// Torso
const torsoGeo = new THREE.BoxGeometry(0.5, 1.1, 0.3);
const torso = new THREE.Mesh(torsoGeo, bronzeMaterial);
torso.position.y = 1.2 + 0.55;
fig.add(torso);

// Head
const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
const head = new THREE.Mesh(headGeo, bronzeMaterial);
head.position.y = 1.2 + 1.1 + 0.3;
fig.add(head);

// Arms (Generic position)
const armGeo = new THREE.CylinderGeometry(0.08, 0.08, 1, 8);
const armL = new THREE.Mesh(armGeo, bronzeMaterial);
armL.position.set(-0.35, 2, 0);
armL.rotation.z = 0.5;
fig.add(armL);

const armR = new THREE.Mesh(armGeo, bronzeMaterial);
armR.position.set(0.35, 2, 0);
armR.rotation.z = -0.5;
fig.add(armR);

return fig;
}

// Figure 1
const fig1 = createFigure(-0.4, 0, 0.2);
// Adjust arm for flag holding
const armR1 = fig1.children[4]; // Right arm
armR1.rotation.z = -2.5; // Raised up
armR1.position.y = 2.2;
statueGroup.add(fig1);

// Figure 2
const fig2 = createFigure(0.4, 0, -0.2);
// Adjust arm for flag holding
const armL2 = fig2.children[3]; // Left arm
armL2.rotation.z = 2.5; // Raised up
armL2.position.y = 2.2;
statueGroup.add(fig2);

// The Flag
const poleGeo = new THREE.CylinderGeometry(0.03, 0.03, 3, 8);
const pole = new THREE.Mesh(poleGeo, new THREE.MeshStandardMaterial({color: 0x333333}));
// Position pole between them, held by raised hands
pole.position.set(0, 2, 0.2);
pole.rotation.z = -0.4; // Tilted back slightly like in photo
pole.rotation.x = 0.2;
statueGroup.add(pole);

const flagGeo = new THREE.PlaneGeometry(1.2, 0.8);
const flag = new THREE.Mesh(flagGeo, redFlagMaterial);
flag.position.set(0.6, 3.0, 0.2); // Top of pole
flag.rotation.z = -0.4;
flag.rotation.x = 0.2;
flag.castShadow = true;
// Make flag double sided
flag.material.side = THREE.DoubleSide;
statueGroup.add(flag);

monumentGroup.add(statueGroup);

return monumentGroup;
}

const monument = createMonument();
scene.add(monument);

// --- GROUND ---
const groundGeo = new THREE.CircleGeometry(40, 64);
const groundMat = new THREE.MeshStandardMaterial({
color: 0x333333,
roughness: 1
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Road Markings (Yellow circle around base)
const roadRingGeo = new THREE.RingGeometry(8.2, 8.5, 64);
const roadRingMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
const roadRing = new THREE.Mesh(roadRingGeo, roadRingMat);
roadRing.rotation.x = -Math.PI / 2;
roadRing.position.y = 0.01;
scene.add(roadRing);

// --- ENVIRONMENT (Simple blocks for buildings) ---
function addBuilding(x, z, w, h, d, color) {
const geo = new THREE.BoxGeometry(w, h, d);
const mat = new THREE.MeshStandardMaterial({ color: color });
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set(x, h/2, z);
scene.add(mesh);
}
// Background context
addBuilding(-25, -20, 10, 15, 10, 0xaaaaaa);
addBuilding(25, -15, 8, 12, 8, 0xcccccc);
addBuilding(-10, -30, 15, 8, 5, 0x999999);


// --- ANIMATION LOOP ---
function animate() {
requestAnimationFrame(animate);
controls.update();
renderer.render(scene, camera);
}

// --- RESIZE HANDLER ---
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
